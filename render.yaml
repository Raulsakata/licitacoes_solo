services:
  - type: web
    name: monitor-licitacoes-api
    runtime: python
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHONPATH
        value: src
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
  - type: cron
    name: monitor-licitacoes-sync
    runtime: python
    schedule: "0 */6 * * *"
    buildCommand: pip install .
    startCommand: python scripts/sync_pncp.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHONPATH
        value: src
